<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESS SCADA Commissioning - Envision Energy</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- BANNER HEADER -->
    <div class="banner-header" id="mainBanner">
        <div style="display: flex; gap: 15px; align-items: center;">
            <button class="btn-action" id="btn-back-menu" style="display:none;" onclick="goBackToMenu()">← ATRÁS</button>
            <div class="envision-logo">
                <img id="nav-logo" src="" alt="Logo">
                <div id="nav-logo-text" style="font-size:1.6rem;">⚡ BESS Portal</div>
            </div>
        </div>
        <div class="nav-right" id="banner-nav" style="display:none;">
            <button class="btn-action" style="background:var(--panel-bg);" onclick="toggleLang()">🌐 EN/ES</button>
            <button class="btn-action" style="background: var(--panel-bg); border-color: var(--accent-blue);" onclick="switchTab('about')" data-tr="btn-about">👤 Sobre</button>
            <button id="btn-lock" class="btn-action" style="background: #475569;" onclick="toggleEditMode()" data-tr="btn-lock">🔒 Lectura</button>
            <button class="btn-action" style="background: var(--accent-yellow); color: black;" onclick="undoAction()" data-tr="btn-undo">↩ Deshacer</button>
            <button class="btn-action" onclick="document.getElementById('brandingModal').classList.remove('hidden')" data-tr="btn-brand">⚙️ Ajustes</button>
            <button class="btn-action" style="background: #3b82f6; border-color: #2563eb;" onclick="openExportModal()" data-tr="btn-report">📄 Reporte</button>
            <button class="btn-action btn-save" onclick="manualSave()" data-tr="btn-save">💾 Guardar</button>
        </div>
    </div>

    <!-- MODAL CONTRASEÑA -->
    <div id="passwordModal" class="modal-overlay hidden" style="z-index: 9999;">
        <div class="modal-card" style="width: 350px; text-align: center;">
            <h2 id="pwd-modal-title" style="color: var(--accent-blue); margin-top: 0;" data-tr="pwd-tit">Ingrese Contraseña</h2>
            <p id="pwd-modal-desc" style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;" data-tr="pwd-sub">Ingrese la Contraseña de Acceso:</p>
            <div style="position: relative; margin-bottom: 20px;">
                <input type="password" id="pwd-modal-input" style="width: 100%; padding: 12px; padding-right: 45px; box-sizing: border-box; background:#0f172a; border: 2px solid #334155; color: white; border-radius: 8px; font-size: 1rem;">
                <button onclick="togglePwdVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--accent-blue); cursor: pointer; font-size: 1.2rem;">👁</button>
            </div>
            <button class="btn-primary" id="pwd-modal-btn" onclick="submitPassword()" style="font-size:1rem; padding:12px;" data-tr="pwd-ok">Aceptar</button>
            <button class="btn-action" id="pwd-modal-cancel" style="width: 100%; margin-top: 10px; background: transparent; border: 2px solid #ef4444; color: #ef4444;" onclick="closePasswordModal()" data-tr="pwd-cancel">Cancelar</button>
        </div>
    </div>

    <!-- MODAL AJUSTES -->
    <div id="brandingModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 style="color: var(--accent-blue); margin-top: 0;" data-tr="btn-brand">⚙️ Ajustes</h2>
            <div class="form-group"><label>Logo PNG/JPG:</label><input type="file" id="logoUpload" accept="image/*"></div>
            <div class="form-group"><label>Banner Image:</label><input type="file" id="bannerUpload" accept="image/*"></div>
            <hr style="border: 1px solid #334155; margin: 20px 0;">
            <button class="btn-action" style="width:100%; margin-bottom:15px; background:var(--accent-yellow); color:black;" onclick="changePassword()">🔑 Cambiar Contraseña</button>
            <button class="btn-primary" onclick="document.getElementById('brandingModal').classList.add('hidden')" data-tr="pwd-ok">Cerrar</button>
        </div>
    </div>

    <!-- MODAL EXPORTAR -->
    <div id="exportModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 style="color: var(--accent-blue); margin-top: 0;" data-tr="ex-title">Exportar Reporte</h2>
            <div class="form-group"><label>Desde:</label><input type="date" id="export-start" onchange="this.blur()"></div>
            <div class="form-group"><label>Hasta:</label><input type="date" id="export-end" onchange="this.blur()"></div>
            <button class="btn-primary" onclick="executeWordExport()" data-tr="ex-gen">Generar Documento</button>
            <button class="btn-action" style="width:100%; margin-top:10px; background:#ef4444; border:none;" onclick="document.getElementById('exportModal').classList.add('hidden')" data-tr="pwd-cancel">Cancelar</button>
        </div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <div class="setup-title">
            <div class="envision-logo" style="font-size: 4rem; justify-content: center;">
                <img id="setup-logo" src="" alt="Logo">
                <span>⚡ BESS</span>
            </div>
            <p style="color: var(--text-secondary); font-size: 1.1rem; margin-top: 15px;">Portal de Comisioning - Envision Energy</p>
        </div>
        
        <div style="display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;">
            <div class="setup-card">
                <h2 style="color:var(--accent-blue)" data-tr="s-load">📂 Cargar</h2>
                <select id="loadProjectSelect"><option value="">-- Select --</option></select>
                <button class="btn-primary" onclick="loadProject()" style="margin-top: 10px;">Abrir</button>
            </div>
            
            <div class="setup-card">
                <h2 style="color:var(--accent-blue)" data-tr="s-new">➕ Nuevo</h2>
                <input type="text" id="projectNameInput" placeholder="Nombre (Ej: SDLA)">
                <input type="number" id="numSetsInput" placeholder="# Sets" min="1" max="100">
                <button class="btn-primary" onclick="createNewProject()" style="margin-top: 10px;">Crear</button>
            </div>
            
            <div class="setup-card" style="border-color: var(--accent-yellow);">
                <h2 style="color:var(--accent-yellow)" data-tr="s-backup">💾 Backup</h2>
                <button class="btn-action" style="width:100%; margin-bottom:10px;" onclick="exportDatabase()">📥 Descargar</button>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importDatabase(event)">
                <button class="btn-action" style="width:100%;" onclick="document.getElementById('importFile').click()">📤 Cargar</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
        <div class="header">
            <div style="display:flex; align-items:baseline; gap:10px;">
                <input type="text" class="project-title-input" id="displayProjectName" onchange="updateProjectTitle(this.value)" value="Proyecto" style="background: transparent; border: none; border-bottom: 2px solid var(--accent-blue); color: var(--accent-blue); font-size: 1.5rem; font-weight: bold; padding: 5px;">
            </div>
        </div>
        
        <div class="container">
            <!-- AQUÍ SE INSERTAN LOS TABS -->
            <div id="tabs-container"></div>
        </div>
    </div>

    <!-- SCRIPT MEJORADO -->
    <script>
        // Configuración básica
        let lang = 'es';
        let db = JSON.parse(localStorage.getItem('bess_projects')) || {};
        let currentProject = "";
        let projectData = { totalSets: 0, sets: [], energyLogs: [], mapElements: [], zones: [], planning: {} };
        let isEditMode = false;
        let historyStack = [];
        let globalPassword = localStorage.getItem('bess_masterpass') || 'ENVISION1201$';
        let selectedGlobalDate = '';
        let editingLogId = null;
        let pwdCallback = null;
        
        // Variables para gráficos
        let coldPieInstance = null, hotPieInstance = null, deliveryPieInstance = null;
        let c1PieInstance = null, c2PieInstance = null, c3PieInstance = null, cbPieInstance = null;
        let planChartInstance = null, energyCumChartInstance = null, energyDailyChartInstance = null;
        let energySingleChartInstance = null;
        
        // Estado del mapa
        let currentZoom = 1, isMapEditMode = false, selectedMapSets = new Set();
        let calDate = new Date();
        
        const COMPONENT_LIST = ['Bat A (ESS.2)', 'Bat B (ESS.1)', 'Bat C (ESS.3)', 'Bat D (ESS.4)', 'LV Room', 'RMU', 'PCS 1', 'MVT', 'PCS 2', 'SCADA'];
        
        // Diccionarios de traducción
        const dict = {
            'es': { 't-del': 'Delivery', 't-cold': 'Cold Comm.', 't-hot': 'Hot Comm.', 't-cycles': 'Ciclos', 't-energy': 'Energía', 't-trouble': 'Troubleshooting', 't-map': 'Mapa' },
            'en': { 't-del': 'Delivery', 't-cold': 'Cold Comm.', 't-hot': 'Hot Comm.', 't-cycles': 'Cycles', 't-energy': 'Energy', 't-trouble': 'Troubleshooting', 't-map': 'Map' }
        };
        
        function toggleLang() {
            lang = lang === 'es' ? 'en' : 'es';
            document.querySelectorAll('[data-tr]').forEach(el => {
                let key = el.getAttribute('data-tr');
                if(dict[lang] && dict[lang][key]) el.innerText = dict[lang][key];
            });
        }
        
        // Funciones de contraseña
        function openPwdModal(title, desc, allowCancel, callback) {
            let tEl = document.getElementById('pwd-modal-title');
            if(tEl) tEl.innerText = title;
            let dEl = document.getElementById('pwd-modal-desc');
            if(dEl) dEl.innerText = desc;
            pwdCallback = callback;
            document.getElementById('passwordModal').classList.remove('hidden');
        }
        
        function submitPassword() {
            let pwd = document.getElementById('pwd-modal-input').value;
            document.getElementById('passwordModal').classList.add('hidden');
            if(pwdCallback) pwdCallback(pwd);
            document.getElementById('pwd-modal-input').value = '';
        }
        
        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            if(pwdCallback) pwdCallback(null);
        }
        
        function togglePwdVisibility() {
            let input = document.getElementById('pwd-modal-input');
            if(input) input.type = input.type === 'password' ? 'text' : 'password';
        }
        
        function enterApp() {
            openPwdModal("Acceso Protegido", "Ingrese la Contraseña de Acceso:", false, function(pwd) {
                if(pwd === globalPassword) {
                    startApp();
                } else {
                    alert("❌ Contraseña incorrecta");
                }
            });
        }
        
        function toggleEditMode() {
            if(isEditMode) {
                isEditMode = false;
                applySecurityMode();
            } else {
                openPwdModal("Desbloquear Edición", "Ingrese contraseña para editar:", true, function(pwd) {
                    if(pwd === globalPassword) {
                        isEditMode = true;
                        applySecurityMode();
                    } else if(pwd !== null) {
                        alert("❌ Contraseña incorrecta");
                    }
                });
            }
        }
        
        function applySecurityMode() {
            let btn = document.getElementById('btn-lock');
            if(isEditMode) {
                document.body.classList.remove('read-only-mode');
                btn.innerHTML = '🔓 Editable';
                btn.style.background = 'var(--accent-green)';
            } else {
                document.body.classList.add('read-only-mode');
                btn.innerHTML = '🔒 Lectura';
                btn.style.background = '#475569';
            }
        }
        
        function changePassword() {
            openPwdModal("Cambiar Contraseña", "Ingrese contraseña ACTUAL:", true, function(pwd) {
                if(!pwd) return;
                if(pwd === globalPassword) {
                    let newPwd = prompt("Ingrese nueva contraseña:");
                    if(newPwd) {
                        globalPassword = newPwd;
                        localStorage.setItem('bess_masterpass', newPwd);
                        alert("✅ Contraseña actualizada");
                        document.getElementById('brandingModal').classList.add('hidden');
                    }
                } else {
                    alert("❌ Contraseña incorrecta");
                }
            });
        }
        
        // Funciones de proyecto
        function updateProjectList() {
            const select = document.getElementById('loadProjectSelect');
            select.innerHTML = '<option value="">-- Seleccione Proyecto --</option>';
            Object.keys(db).forEach(proj => {
                let opt = document.createElement('option');
                opt.value = proj;
                opt.textContent = proj;
                select.appendChild(opt);
            });
        }
        
        function saveToLocal(pushHistory = true) {
            if(currentProject) {
                db[currentProject] = projectData;
                try {
                    localStorage.setItem('bess_projects', JSON.stringify(db));
                } catch (e) {
                    alert("⚠️ Almacenamiento lleno");
                }
            }
        }
        
        function manualSave() {
            if(!isEditMode)return;
            saveToLocal(false);
            alert("✅ Guardado correctamente");
        }
        
        function createNewProject() {
            let name = document.getElementById('projectNameInput').value.trim();
            let num = parseInt(document.getElementById('numSetsInput').value);
            if(!name || !num) return alert("❌ Datos incompletos");
            if(db[name]) return alert("⚠️ El proyecto ya existe");
            
            currentProject = name;
            projectData = {
                totalSets: num,
                sets: [],
                energyLogs: [],
                mapElements: [],
                zones: [],
                planning: { start:'', delivery:'', cold:'', hot:'', c1:'', c2:'', c3:'', cb:'', weights: { delivery:10, cold:25, hot:40, c1:55, c2:70, c3:85, cb:95 } }
            };
            
            for(let i=1; i<=num; i++) {
                projectData.sets.push({ id: `Set ${i}`, cold: false, hot: false, c1: false, c2: false, c3: false, cb: false, tbStatus: "OK", tbComp: [], tbDesc: "", tbSol: "", history: [], delivery: false, batCount: 4, mapX: 50, mapY: 50 });
            }
            
            saveToLocal();
            updateProjectList();
            enterApp();
        }
        
        function loadProject() {
            let name = document.getElementById('loadProjectSelect').value;
            if(!name) return;
            currentProject = name;
            projectData = db[name];
            if(!projectData.energyLogs) projectData.energyLogs = [];
            enterApp();
        }
        
        function startApp() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('btn-back-menu').style.display = 'inline-block';
            document.getElementById('banner-nav').style.display = 'flex';
            document.getElementById('displayProjectName').value = currentProject;
            applySecurityMode();
            historyStack = [];
        }
        
        function goBackToMenu() {
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('btn-back-menu').style.display = 'none';
            document.getElementById('banner-nav').style.display = 'none';
            updateProjectList();
        }
        
        // Funciones stub (placeholder)
        function undoAction() { alert("↩ Deshacer"); }
        function openExportModal() { alert("📄 Exportar"); }
        function switchTab(tab) { alert(`📑 Tab: ${tab}`); }
        function exportDatabase() { alert("📥 Descargando..."); }
        function importDatabase(e) { alert("📤 Importando..."); }
        function updateProjectTitle(val) { currentProject = val; saveToLocal(); }
        function executeWordExport() { alert("📄 Generando documento..."); }
        
        // Inicialización
        window.onload = () => {
            updateProjectList();
        };
    </script>
    
    <!-- Cargar enhancements -->
    <script src="enhancements.js"></script>
</body>
</html>
